                this.x = paperRect.x + paperRect.w * 0.22;
                this.y = paperRect.y + 180;
                this.vx = 0;
                this.vy = 0;
                this.jumpsLeft = 2;
                this.scarf.forEach(p => {
                    p.x = this.x;
                    p.y = this.y;
                    p.oldX = this.x;
                    p.oldY = this.y;
                });
            }

            update(dt) {
                const moveSpeed = 520;
                const accel = this.onGround ? 3800 : 2200;

                if (keys.a) {
                    this.vx = Math.max(this.vx - accel * dt, -moveSpeed);
                } else if (keys.d) {
                    this.vx = Math.min(this.vx + accel * dt, moveSpeed);
                } else {
                    // Friction
                    this.vx *= this.onGround ? Math.pow(0.0008, dt) : Math.pow(0.15, dt);
                    if (Math.abs(this.vx) < 5) this.vx = 0;
                }

                if (flight) {
                    const vertical = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
                    this.vy += (vertical * 390 - this.vy) * Math.min(1, dt * 9);
                    flightEmission += dt;
                    while (flightEmission >= 0.025) {
                        flightEmission -= 0.025;
                        emitSparks(this.x + (Math.random() - .5) * 22, this.y - 14, 2, ['#ef4444', '#f59e0b', '#fde68a'], 90, 0, 150);
                    }
                } else {
                    this.vy += 1680 * dt;
                }

                const prevY = this.y;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                if (this.y < paperRect.y + 66 * PLAYER_SCALE) { this.y = paperRect.y + 66 * PLAYER_SCALE; this.vy = Math.max(0, this.vy); }

                // Keep within viewport bounds with soft bounce
                const stage = getStageRect();
                const minX = stage.x + 8;
                const maxX = stage.x + stage.w - 8;
                if (this.x < minX) { this.x = minX; this.vx = 0; }
                if (this.x > maxX) { this.x = maxX; this.vx = 0; }

                // Platform & Floor Collisions
                this.onGround = false;
                const floorY = paperRect.y + paperRect.h - 14;

                if (this.y >= floorY) {
                    this.y = floorY;
                    this.vy = 0;
                    this.onGround = true;
                    this.jumpsLeft = 2;
                } else if (!flight && this.vy >= 0 && !keys.s) {
                    // Check semi-solid section platforms
                    for (const plat of platforms) {
                        if (
                            this.x >= plat.x - 10 &&
                            this.x <= plat.x + plat.w + 10 &&
                            prevY <= plat.y + 4 &&
                            this.y >= plat.y
                        ) {
                            this.y = plat.y;
                            this.vy = 0;
                            this.onGround = true;
                            this.jumpsLeft = 2;
                            break;
                        }
                    }
                }

                // Aiming angle toward mouse
                const shoulderX = this.x;
                const shoulderY = this.y - 42 * PLAYER_SCALE;
                this.aimAngle = Math.atan2(mouse.y - shoulderY, mouse.x - shoulderX);
                this.facing = Math.cos(this.aimAngle) >= 0 ? 1 : -1;

                // Walk cycle animation phase
                if (this.onGround && Math.abs(this.vx) > 15) {
                    this.walkCycle += Math.abs(this.vx) * dt * 0.042;
                } else if (this.onGround) {
                    this.walkCycle *= 0.85;
                } else {
                    this.walkCycle += 2.5 * dt;
                }

                // Decay weapon recoil & hammer swing
                this.recoilOffset *= Math.pow(0.001, dt);
                if (this.hammerSwing > 0) {
                    this.hammerSwing = Math.max(0, this.hammerSwing - dt * 4.2);
                }
                if (this.hammerCooldown > 0) this.hammerCooldown -= dt;
                this.swordSwing = Math.max(0, this.swordSwing - dt * 5);
                if (this.fireCooldown > 0) this.fireCooldown -= dt;

                // Update Verlet Red Scarf
                const neckX = this.x - this.facing * 3;
                const neckY = this.y - 40;
                this.scarf[0].x = neckX;
                this.scarf[0].y = neckY;

                const windX = -this.vx * 0.015 - Math.cos(this.aimAngle) * this.recoilOffset * 0.8 + (Math.sin(performance.now() * 0.008) * 0.4);
                const gravityY = 0.35;

                for (let i = 1; i < this.scarf.length; i++) {
                    const p = this.scarf[i];
                    const vx = (p.x - p.oldX) * 0.92;
                    const vy = (p.y - p.oldY) * 0.92;
                    p.oldX = p.x;
                    p.oldY = p.y;
                    p.x += vx + windX + (Math.random() - 0.5) * 0.3;
                    p.y += vy + gravityY;
                }

                // Distance constraints for scarf
                const segLen = 5.2;
                for (let iter = 0; iter < 4; iter++) {
                    this.scarf[0].x = neckX;
                    this.scarf[0].y = neckY;
                    for (let i = 0; i < this.scarf.length - 1; i++) {
                        const p1 = this.scarf[i];
                        const p2 = this.scarf[i + 1];
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const dist = Math.hypot(dx, dy) || 0.001;
                        const diff = (dist - segLen) / dist;
                        if (i === 0) {
                            p2.x -= dx * diff;
                            p2.y -= dy * diff;
                        } else {
                            p1.x += dx * diff * 0.5;
                            p1.y += dy * diff * 0.5;
                            p2.x -= dx * diff * 0.5;
                            p2.y -= dy * diff * 0.5;
                        }
                    }
                }
            }

            jump() {
                if (flight) return;
                if (this.jumpsLeft > 0) {
                    this.vy = -660;
                    this.onGround = false;
                    this.jumpsLeft--;
                    // Jump dust particles
                    for (let i = 0; i < 8; i++) {
                        particles.push({
                            x: this.x + (Math.random() - 0.5) * 16,
                            y: this.y,
                            vx: (Math.random() - 0.5) * 140 - this.vx * 0.2,
                            vy: -Math.random() * 80,
                            size: 2.5 + Math.random() * 3,
                            color: '#64748b',
                            life: 0.35,
                            maxLife: 0.35,
                            glow: false
                        });
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y); ctx.scale(PLAYER_SCALE, PLAYER_SCALE); ctx.translate(-this.x, -this.y);
                if (flight) drawFlightAura(ctx, this);

                // 1. Draw flowing Crimson Scarf first (behind weapon/head)
                ctx.beginPath();
                ctx.moveTo(this.scarf[0].x, this.scarf[0].y);
                for (let i = 1; i < this.scarf.length - 1; i++) {
                    const xc = (this.scarf[i].x + this.scarf[i + 1].x) * 0.5;
                    const yc = (this.scarf[i].y + this.scarf[i + 1].y) * 0.5;

                ctx.lineWidth = 6.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = 'rgba(244, 63, 94, 0.55)';
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Body lean based on horizontal velocity & recoil
                const lean = (this.vx / 520) * 8 - Math.cos(this.aimAngle) * this.recoilOffset * 0.6;
                const hipX = this.x;
                const hipY = this.y - 20;
                const neckX = this.x + lean;
                const neckY = this.y - 42;
                const headX = neckX + lean * 0.35;
                const headY = neckY - 12;

                // Stickman shadow on ground/paper
                ctx.fillStyle = 'rgba(15, 23, 42, 0.22)';
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + 1, 14, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Stickman ink style (Dark Obsidian with subtle cyan rim on dark, crisp on white paper)
                ctx.strokeStyle = flight ? '#fbbf24' : '#0f172a';
                ctx.lineWidth = 4.6;
                if (flight) { ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 14; }
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // 2. Procedural Legs (2-Bone Running/Jumping)
                for (let side = -1; side <= 1; side += 2) {
                    const phase = this.walkCycle + (side === 1 ? 0 : Math.PI);
                    let footX, footY, kneeX, kneeY;

                    if (this.onGround) {
                        const stride = Math.min(Math.abs(this.vx) / 280, 1) * 14;
                        footX = hipX + Math.sin(phase) * stride;
                        footY = this.y + Math.min(0, Math.cos(phase) * stride * 0.45);
                        kneeX = (hipX + footX) * 0.5 + this.facing * 5;
                        kneeY = (hipY + footY) * 0.5 - 2;
                    } else {
                        // Mid-air pose
                        footX = hipX + side * 7 - Math.clamp(this.vx * 0.02, -8, 8);
                        footY = this.y - 4 + side * 3;
                        kneeX = hipX + this.facing * 8 + side * 3;
                        kneeY = hipY + 9;
                    }

                    ctx.beginPath();
                    ctx.moveTo(hipX, hipY);
                    ctx.lineTo(kneeX, kneeY);
                    ctx.lineTo(footX, footY);
                    ctx.stroke();
                }

                // 3. Spine / Torso
                ctx.beginPath();
                ctx.moveTo(hipX, hipY);
                ctx.lineTo(neckX, neckY);
                ctx.stroke();

                // 4. Head + Expressive Glowing Eyes
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(headX, headY, 10.5, 0, Math.PI * 2);
                ctx.fill();
                // White outline so stickman pops even on scorched dark spots
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // Angry glowing eyes (Reviewer #2 rage mode)
                const eyeDirX = Math.cos(this.aimAngle) * 3.5;
                const eyeDirY = Math.sin(this.aimAngle) * 2.5;
                ctx.fillStyle = '#f43f5e';
                ctx.shadowColor = '#f43f5e';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(headX + eyeDirX + 2.5 * this.facing, headY + eyeDirY - 1, 2.1, 0, Math.PI * 2);
                ctx.arc(headX + eyeDirX - 1.5 * this.facing, headY + eyeDirY - 1, 1.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // 5. Weapon & Arms rendering
                this.drawWeaponAndArms(ctx, neckX, neckY);

                ctx.restore();
            }

            drawWeaponAndArms(ctx, shoulderX, shoulderY) {
                ctx.save();
                ctx.translate(shoulderX, shoulderY);

                    ctx.fillRect(30 + rx, -8, 4, 16);
                    ctx.fillStyle = '#fef08a'; ctx.fillRect(39 + rx, -2, 12, 4);

                    ctx.lineTo(52, 0);
                    ctx.stroke();

                    // Oversized Neon-Edged Warhammer Head
                    ctx.fillStyle = '#1e293b';
                    ctx.strokeStyle = '#f59e0b';

                    ctx.shadowColor = 'rgba(245, 158, 11, 0.6)';

                    ctx.fill();

                    ctx.fillStyle = '#fbbf24';

                    ctx.fillRect(46, 12, 14, 4);

                    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(24, 0); ctx.stroke();
                    ctx.strokeStyle = flight ? '#fbbf24' : '#67e8f9'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(23, -9); ctx.lineTo(23, 9); ctx.stroke();
                    ctx.fillStyle = '#dffbff'; ctx.shadowColor = flight ? '#ef4444' : '#22d3ee'; ctx.shadowBlur = 13;

        Math.clamp = (val, min, max) => Math.max(min, Math.min(max, val));
        const stickman = new Stickman();

        function emitSparks(x, y, count, colors, speed = 240, biasX = 0, biasY = 0) {
            for (let i = 0; i < count; i++) {
                const a = Math.random() * Math.PI * 2;
                const life = .2 + Math.random() * .35;
                particles.push({ x, y, vx: Math.cos(a) * speed + biasX, vy: Math.sin(a) * speed + biasY,
                    size: 1 + Math.random() * 2.3, color: colors[i % colors.length], life, maxLife: life, glow: true });
            }
        }

        function weaponPose() {
            const angle = stickman.aimAngle, dirX = Math.cos(angle), dirY = Math.sin(angle);
            const lean = (stickman.vx / 520) * 8 - dirX * stickman.recoilOffset * .6;
            const shoulderX = stickman.x + lean * PLAYER_SCALE, shoulderY = stickman.y - 42 * PLAYER_SCALE;
            return { angle, dirX, dirY, shoulderX, shoulderY,
                muzzleX: shoulderX + dirX * 52 * PLAYER_SCALE, muzzleY: shoulderY + dirY * 52 * PLAYER_SCALE };
        }

        function drawSpaceCollapse(well) {
            const radius = well.pullRadius * .66 * Math.sqrt(Math.max(.002, well.collapse));
            if (radius < 12) return;
            const span = 544, pixels = Math.ceil(span * pixelRatio);
            if (lensCanvas.width !== pixels) { lensCanvas.width = pixels; lensCanvas.height = pixels; }
            const lens = lensCanvas.getContext('2d'); lens.clearRect(0, 0, pixels, pixels);
            lens.drawImage(canvas, (well.x - span / 2 + screenShake.x) * pixelRatio, (well.y - span / 2 + screenShake.y) * pixelRatio,
                span * pixelRatio, span * pixelRatio, 0, 0, pixels, pixels);
            for (let i = 0; i < 12; i++) {
                const outer = radius * (1 - i / 12), inner = radius * (1 - (i + 1) / 12), mid = (outer + inner) / 2;
                const deflection = 26 * Math.sin(well.collapse * Math.PI / 2) * Math.pow(1 - mid / radius, 2);
                const scale = mid / (mid + deflection);
                ctx.save(); ctx.beginPath(); ctx.arc(well.x, well.y, outer, 0, Math.PI * 2);
                ctx.moveTo(well.x + inner, well.y); ctx.arc(well.x, well.y, inner, 0, Math.PI * 2, true); ctx.clip('evenodd');
                ctx.drawImage(lensCanvas, well.x - span * scale / 2, well.y - span * scale / 2, span * scale, span * scale); ctx.restore();
            }
            ctx.save(); ctx.strokeStyle = well.ascended ? '#fbbf2420' : '#a5b4fc20'; ctx.lineWidth = .7;
            for (let i = 0; i < 8; i++) {
                const a = i * Math.PI / 4 + well.phase * .015;
                ctx.beginPath();
                for (let j = 0; j <= 16; j++) {
                    const t = j / 16, r = well.radius * 2 + t * radius, theta = a + (1 - t) ** 2 * 1.4 * well.collapse;
                    const x = well.x + Math.cos(theta) * r, y = well.y + Math.sin(theta) * r;
                    if (!j) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawTimeRewind() {
            const progress = Math.clamp(rewindTimer / 1.1, 0, 1), envelope = Math.sin(progress * Math.PI);
            const x = paperRect.x + paperRect.w / 2, y = paperRect.y + paperRect.h / 2;
            ctx.save(); ctx.globalAlpha = envelope * .18;
            for (let i = 0; i < 9; i++) {
                const stripH = H / 9, offset = Math.sin(i * 1.7 - progress * 20) * 16 * envelope;
                ctx.drawImage(rewindEcho, 0, i * stripH, W, stripH, offset, i * stripH, W, stripH);
            }
            ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = envelope * .12;
            ctx.fillStyle = '#06132b'; ctx.fillRect(paperRect.x, paperRect.y, paperRect.w, paperRect.h);
            ctx.globalAlpha = envelope * .85;
            ctx.strokeStyle = '#38bdf8'; ctx.shadowColor = '#818cf8'; ctx.shadowBlur = 14;
            for (let i = 0; i < 6; i++) {
                const radius = 35 + ((1 - progress + i / 6) % 1) * Math.min(paperRect.w, paperRect.h) * .45;
                ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(x, y, radius, radius * .38, -.25, -progress * 8 + i, -progress * 8 + i + 4.7); ctx.stroke();
            }
            const radius = Math.min(165, paperRect.w * .21);
            for (let i = 0; i < 48; i++) {
                const a = i * Math.PI / 24 - progress * 5, inner = radius - (i % 4 === 0 ? 13 : 5);
                ctx.strokeStyle = i % 4 === 0 ? '#c4b5fd' : '#38bdf877'; ctx.lineWidth = i % 4 === 0 ? 2 : 1;
                ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * inner, y + Math.sin(a) * inner);
                ctx.lineTo(x + Math.cos(a) * radius, y + Math.sin(a) * radius); ctx.stroke();
            }
            ctx.strokeStyle = '#818cf8'; ctx.lineWidth = 2; ctx.globalAlpha = envelope * .5;
            ctx.strokeRect(paperRect.x + 3, paperRect.y + 3, paperRect.w - 6, paperRect.h - 6); ctx.restore();
        }

        async function renderPdfSource(doc, index, lib) {
            const page = await doc.getPage(index + 1);

            // Stable canonical raster dimensions keep saved crop coordinates valid on resize.
            const scale = Math.min(3000 / Math.max(unit.width, unit.height), Math.sqrt(8e6 / (unit.width * unit.height)));

            const colW = (contentW - colGap) * 0.5;

            let curY = paperRect.y + 34;

            // Helper to tokenize & push words along a wrapped block
            function addTextBlock(text, startX, startY, maxWidth, font, color, isMath = false, isHeader = false) {
                ctx.font = font;
                const tokens = text.match(/[\u3400-\u9fff]|[^\s\u3400-\u9fff]+/gu) || [];
                let lineX = startX;
                let lineY = startY;
                const fontSizeMatch = font.match(/(\d+(?:\.\d+)?)px/);
                const fontSize = fontSizeMatch ? parseFloat(fontSizeMatch[1]) : 13;
                const lineHeight = fontSize * 1.38;
                const spaceW = ctx.measureText(' ').width * 0.95;

                tokens.forEach(token => {
                    const metrics = ctx.measureText(token);
                    const w = Math.max(metrics.width, 8);
                    if (lineX + w > startX + maxWidth && lineX > startX) {
                        lineX = startX;
                        lineY += lineHeight;
                    }
                    wordBodies.push({
                        text: token,
                        origX: lineX + w * 0.5,
                        origY: lineY,
                        x: lineX + w * 0.5,
                        y: lineY,
                        vx: 0,
                        vy: 0,
                        angle: 0,
                        vAngle: 0,
                        w: w,
                        h: fontSize,
                        font: font,
                        color: color,
                        isMath: isMath,
                        isHeader: isHeader,
                        state: 'formatted', // 'formatted' | 'detached' | 'obliterated'
                        hp: isHeader ? 2 : 1,
                        type: 'word'
                    });
                    lineX += w + spaceW;
                });

                return lineY + lineHeight;
            }

            // Helper for centered single or wrapped lines (Title / Authors)
            function addCenteredBlock(text, startY, maxWidth, font, color, isHeader = false) {
                ctx.font = font;
                const tokens = text.split(/\s+/).filter(Boolean);
                const fontSizeMatch = font.match(/(\d+(?:\.\d+)?)px/);
                const fontSize = fontSizeMatch ? parseFloat(fontSizeMatch[1]) : 16;
                const lineHeight = fontSize * 1.3;
                const spaceW = ctx.measureText(' ').width;

                let lines = [];
                let currentLine = [];
                let currentW = 0;

                tokens.forEach(t => {
                    const tw = ctx.measureText(t).width;
                    if (currentW + tw > maxWidth && currentLine.length > 0) {
                        lines.push({ words: currentLine, totalW: currentW - spaceW });
                        currentLine = [{ text: t, w: tw }];
                        currentW = tw + spaceW;
                    } else {
                        currentLine.push({ text: t, w: tw });
                        currentW += tw + spaceW;
                    }
                });
                if (currentLine.length > 0) {
                    lines.push({ words: currentLine, totalW: currentW - spaceW });
                }

                let y = startY;
                lines.forEach(line => {
                    let x = paperRect.x + (paperRect.w - line.totalW) * 0.5;
                    line.words.forEach(item => {
                        wordBodies.push({
                            text: item.text,
                            origX: x + item.w * 0.5,
                            origY: y,
                            x: x + item.w * 0.5,
                            y: y,
                            vx: 0,
                            vy: 0,
                            angle: 0,
                            vAngle: 0,
                            w: item.w,
                            h: fontSize,
                            font: font,
                            color: color,
                            isMath: false,
                            isHeader: isHeader,
                            state: 'formatted',
                            hp: 2,
                            type: 'word'
                        });
                        x += item.w + spaceW;
                    });
                    y += lineHeight;
                });
                return y;
            }

            const scale = Math.clamp(paperRect.w / 840, 0.72, 1.05);

            // 1. Top Venue Header + Red "MAJOR REVISION" Stamp
            addTextBlock(tpl.venue, paperRect.x + marginX, curY, contentW * 0.7, `italic ${Math.round(11 * scale)}px "Crimson Pro", Georgia, serif`, '#475569');
            // Red Reviewer #2 Stamp tokens in top-right
            addTextBlock("[STATUS: MAJOR REVISION - REVIEWER #2]", paperRect.x + paperRect.w - marginX - 240 * scale, curY, 250 * scale, `700 ${Math.round(11 * scale)}px "JetBrains Mono", monospace`, '#e11d48', false, true);
            curY += 24 * scale;

            // 2. Paper Title (Bold Classical Serif)
            curY = addCenteredBlock(tpl.title, curY, contentW * 0.94, `700 ${Math.round(21 * scale)}px "Crimson Pro", Georgia, serif`, '#0f172a', true);
            curY += 6 * scale;

            // Title Horizontal Rule Platform
            platforms.push({ x: paperRect.x + marginX, y: curY, w: contentW, label: 'title-rule' });
            curY += 14 * scale;

            // 3. Authors & Affiliations
            curY = addCenteredBlock(tpl.authors, curY, contentW * 0.9, `600 ${Math.round(12.5 * scale)}px "Crimson Pro", Georgia, serif`, '#1e293b');
            curY = addCenteredBlock(tpl.affil, curY, contentW * 0.9, `italic ${Math.round(11 * scale)}px "Crimson Pro", Georgia, serif`, '#475569');
            curY += 14 * scale;

            // 4. Double-Column Body Start
            const col1X = paperRect.x + marginX;
            const col2X = paperRect.x + marginX + colW + colGap;
            let col1Y = curY;
            let col2Y = curY;

            if (currentTemplateKey === 'custom') {
                const font = `${Math.round(12 * scale)}px "Crimson Pro", Georgia, serif`;
                const lineH = Math.round(12 * scale) * 1.38;
                if (!customPages.length) {
                    ctx.font = font;
                    const tokens = (tpl.abstract || '').match(/[\u3400-\u9fff]|[^\s\u3400-\u9fff]+/gu) || [];
                    const maxLines = Math.max(1, Math.floor((paperRect.y + paperRect.h - 28 - curY) / lineH));
                    let chunk = [], line = 0, usedWidth = 0;
                    for (const token of tokens) {
                        const tw = ctx.measureText(token).width + ctx.measureText(' ').width * .95;
                        if (usedWidth && usedWidth + tw > colW) { line++; usedWidth = 0; }
                        if (line >= maxLines * 2) { customPages.push(chunk.join(' ')); chunk = []; line = 0; usedWidth = 0; }
                        chunk.push(token); usedWidth += tw;
                    }
                    if (chunk.length) customPages.push(chunk.join(' '));
                    if (!customPages.length) customPages.push('No manuscript text supplied.');
                }
                // Flow the full imported text across both columns without repeating it.
                const tokens = customPages[currentPage].match(/[\u3400-\u9fff]|[^\s\u3400-\u9fff]+/gu) || [];
                let x = col1X, y = curY, column = 0;
                ctx.font = font;
                for (const token of tokens) {
                    const tw = ctx.measureText(token).width, space = ctx.measureText(' ').width * .95;
                    const start = column === 0 ? col1X : col2X;
                    if (x > start && x + tw > start + colW) { x = start; y += lineH; }
                    if (column === 0 && y + lineH > paperRect.y + paperRect.h - 28) { column = 1; x = col2X; y = curY; }
                    addTextBlock(token, x, y, Math.max(tw, colW), font, '#1e293b');
                    x += tw + space;
                }
                fitPaperContent(); updatePageControls();  return;
            }

            // --- LEFT COLUMN: Abstract + Section 1 + Section 2 Equations ---
            col1Y = addTextBlock("Abstract", col1X, col1Y, colW, `700 ${Math.round(14 * scale)}px "Crimson Pro", Georgia, serif`, '#0f172a', false, true);
            col1Y = addTextBlock(tpl.abstract, col1X, col1Y + 2, colW, `${Math.round(12 * scale)}px "Crimson Pro", Georgia, serif`, '#1e293b');
            col1Y += 12 * scale;

            // Section 1 Platform + Text
            platforms.push({ x: col1X, y: col1Y - 8, w: colW, label: 'sec1' });
            col1Y = addTextBlock(tpl.sec1Title, col1X, col1Y, colW, `700 ${Math.round(14 * scale)}px "Crimson Pro", Georgia, serif`, '#0f172a', false, true);
            col1Y = addTextBlock(tpl.sec1Body, col1X, col1Y + 2, colW, `${Math.round(12 * scale)}px "Crimson Pro", Georgia, serif`, '#1e293b');
            col1Y += 12 * scale;

            // Section 2 Platform + Dense Math Equations
            platforms.push({ x: col1X, y: col1Y - 8, w: colW, label: 'sec2' });
            col1Y = addTextBlock(tpl.sec2Title, col1X, col1Y, colW, `700 ${Math.round(14 * scale)}px "Crimson Pro", Georgia, serif`, '#0f172a', false, true);
            col1Y = addTextBlock(tpl.sec2Pre, col1X, col1Y + 2, colW, `${Math.round(12 * scale)}px "Crimson Pro", Georgia, serif`, '#1e293b');
            col1Y += 6 * scale;

            // Highlighted Math Equation Box 1 & 2
            col1Y = addTextBlock(tpl.equation1 + "   (1)", col1X + 8, col1Y, colW - 16, `italic 600 ${Math.round(12.5 * scale)}px "Crimson Pro", Georgia, serif`, '#0f172a', true);
            col1Y += 4 * scale;
            col1Y = addTextBlock(tpl.equation2 + "   (2)", col1X + 8, col1Y, colW - 16, `italic 600 ${Math.round(12.5 * scale)}px "Crimson Pro", Georgia, serif`, '#0f172a', true);
            col1Y += 4 * scale;
            col1Y = addTextBlock(tpl.sec2Post, col1X, col1Y, colW, `${Math.round(12 * scale)}px "Crimson Pro", Georgia, serif`, '#1e293b');

            // --- RIGHT COLUMN: Figure 1 Chart (Destructible Bars) + Table 1 + Section 3 ---
            platforms.push({ x: col2X, y: col2Y - 6, w: colW, label: 'fig1-top' });

            // Create interactive destructible Chart Bars for Figure 1
            const chartH = 125 * scale;
            const chartBottom = col2Y + chartH;
            const barData = [
                { label: "Baseline", val: 0.45, color: "#64748b" },
                { label: "PriorArt", val: 0.62, color: "#475569" },
                { label: "Ablation", val: 0.52, color: "#94a3b8" },
                { label: "Ours(SOTA)", val: 0.94, color: "#2563eb" },
                { label: "Rev#2Ask", val: 1.00, color: "#e11d48" }
            ];
            const barSpacing = colW / (barData.length + 1);
            barData.forEach((b, idx) => {
                const bw = Math.min(28 * scale, barSpacing * 0.65);
                const bh = b.val * (chartH - 32 * scale);
                const bx = col2X + barSpacing * (idx + 0.85);
                const by = chartBottom - 16 * scale - bh * 0.5;

                wordBodies.push({
                    text: b.label,
                    origX: bx,
                    origY: by,
                    x: bx,
                    y: by,
                    vx: 0,
                    vy: 0,
                    angle: 0,
                    vAngle: 0,
                    w: bw,
                    h: bh,
                    font: `600 ${Math.round(10 * scale)}px "JetBrains Mono", monospace`,
                    color: b.color,
                    isMath: false,
                    isHeader: true,
                    state: 'formatted',
                    hp: 2,
                    type: 'bar'
                });
            });

            col2Y = chartBottom + 8 * scale;
            col2Y = addTextBlock(tpl.figTitle, col2X, col2Y, colW, `italic 600 ${Math.round(11.5 * scale)}px "Crimson Pro", Georgia, serif`, '#334155');
            col2Y += 14 * scale;

            // Table 1: Destructible Ablation Study Cells
            platforms.push({ x: col2X, y: col2Y - 6, w: colW, label: 'table1' });
            col2Y = addTextBlock(tpl.tableTitle, col2X, col2Y, colW, `700 ${Math.round(12 * scale)}px "Crimson Pro", Georgia, serif`, '#0f172a', false, true);
            col2Y += 4 * scale;

            const tableRows = [
                "Method          Acc(%)   Loss    GPU-Hrs",
                "w/o Coffee       41.2    NaN      999h",
                "w/ Seed=42       78.4    0.82     120h",
                "Ours (Full)      99.9    0.00     0.5h"
            ];
            tableRows.forEach((rowStr, rIdx) => {
                col2Y = addTextBlock(
                    rowStr,
                    col2X + 6,
                    col2Y,
                    colW - 12,
                    `${rIdx === 0 || rIdx === 3 ? '700' : '400'} ${Math.round(11 * scale)}px "JetBrains Mono", monospace`,
                    rIdx === 3 ? '#0f172a' : '#334155',
                    true
                );
            });
            col2Y += 14 * scale;

            // Section 3 Platform + Conclusion
            platforms.push({ x: col2X, y: col2Y - 6, w: colW, label: 'sec3' });
            col2Y = addTextBlock(tpl.sec3Title, col2X, col2Y, colW, `700 ${Math.round(14 * scale)}px "Crimson Pro", Georgia, serif`, '#0f172a', false, true);
            col2Y = addTextBlock(tpl.sec3Body, col2X, col2Y + 2, colW, `${Math.round(12 * scale)}px "Crimson Pro", Georgia, serif`, '#1e293b');

            fitPaperContent();
            updatePageControls();
            
        }

        function fitPaperContent() {
            const bottom = Math.max(...wordBodies.map(w => w.origY + w.h), paperRect.y + 1);
            const ratio = Math.min(1, (paperRect.h - 32) / (bottom - paperRect.y));
            if (ratio < 1) {
                for (const w of wordBodies) {
                    w.y = w.origY = paperRect.y + (w.origY - paperRect.y) * ratio;
                    w.h *= ratio;
                    w.font = w.font.replace(/([\d.]+)px/, (_, n) => `${Number(n) * ratio}px`);
                }
                for (const p of platforms) p.y = paperRect.y + (p.y - paperRect.y) * ratio;
            }
        }

        function fadeDamageMarks(dt) {
            commitDamageResidue();
            damageIdleTime += dt;
            if (damageIdleTime >= DAMAGE_LIFETIME) {
                damageCtx.clearRect(0, 0, damageCanvas.width, damageCanvas.height);
                damageFadeAccumulator = 0;
                return;
            }
            // Larger, infrequent opacity steps avoid visible 8-bit alpha rounding residue.
            damageFadeAccumulator += dt;
            if (damageFadeAccumulator < .1) return;
            damageCtx.save();
            damageCtx.globalCompositeOperation = 'destination-out';
            damageCtx.fillStyle = `rgba(0,0,0,${1 - Math.exp(-.75 * damageFadeAccumulator)})`;
            damageCtx.fillRect(0, 0, damageCanvas.width, damageCanvas.height);
            damageCtx.restore();
            damageFadeAccumulator = 0;
        }

        function commitDamageResidue() {
            if (damageIdleTime < DAMAGE_LIFETIME && !rewindMode) residueCtx.drawImage(damageCanvas, 0, 0);
        }

        function configureCanvas() {
            pixelRatio = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(16e6 / (W * H)));
            canvas.width = Math.round(W * pixelRatio); canvas.height = Math.round(H * pixelRatio);
            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        }

        function scorchLaserLine(x1, y1, x2, y2) {
            // One continuous, canvas-clipped incision; never a chain of radial stamps.
            damageIdleTime = 0;
            damageCtx.save(); damageCtx.lineCap = 'butt';
            const layers = [[8, 'rgba(71,30,24,.15)'], [4, 'rgba(38,20,24,.5)'], [1.8, '#1b1110'], [.6, '#b86d37']];
            for (const [width, color] of layers) {
                damageCtx.strokeStyle = color; damageCtx.lineWidth = width;
                damageCtx.beginPath(); damageCtx.moveTo(x1 - paperRect.x, y1 - paperRect.y);
                damageCtx.lineTo(x2 - paperRect.x, y2 - paperRect.y); damageCtx.stroke();
            }
            damageCtx.restore();
        }

        function scorchPaperAt(worldX, worldY, radius, isLaser = false) {
            const lx = worldX - paperRect.x;
            const ly = worldY - paperRect.y;
            if (lx < -radius || lx > paperRect.w + radius || ly < -radius || ly > paperRect.h + radius) return;
            damageIdleTime = 0;

            damageCtx.save();
            const grad = damageCtx.createRadialGradient(lx, ly, radius * 0.1, lx, ly, radius);
            if (isLaser) {
                grad.addColorStop(0, 'rgba(11, 13, 18, 0.95)');
                grad.addColorStop(0.55, 'rgba(30, 15, 35, 0.75)');
                grad.addColorStop(0.85, 'rgba(236, 72, 153, 0.25)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            } else {
                grad.addColorStop(0, 'rgba(11, 13, 18, 0.92)');
                grad.addColorStop(0.5, 'rgba(24, 24, 32, 0.55)');
                grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            }
            damageCtx.fillStyle = grad;
            damageCtx.beginPath();
            damageCtx.arc(lx, ly, radius, 0, Math.PI * 2);
            damageCtx.fill();
            damageCtx.restore();
        }

        function damageWordBody(wb, impulseX, impulseY, obliterateImmediate = false) {
            if (wb.state === 'obliterated') return;
            if (flight) { impulseX *= 1.05; impulseY *= 1.05; }
            if (flight && wb.state === 'formatted' && Math.random() < .03) obliterateImmediate = true;

            if (wb.state === 'formatted' && !obliterateImmediate) {
                wb.state = 'detached';
                wb.vx = impulseX + (Math.random() - 0.5) * 160;
                wb.vy = impulseY - Math.random() * 180;
                wb.vAngle = (Math.random() - 0.5) * 14;
                sfx.playWordDetach();

                // Highlighter spark burst on detachment
                const col = HIGHLIGHTER_COLORS[Math.floor(Math.random() * HIGHLIGHTER_COLORS.length)];
                for (let i = 0; i < 3; i++) {
                    particles.push({
                        x: wb.x,
                        y: wb.y,
                        vx: (Math.random() - 0.5) * 240 + impulseX * 0.3,
                        vy: (Math.random() - 0.5) * 240 + impulseY * 0.3,
                        size: 2 + Math.random() * 2.5,
                        color: col,
                        life: 0.35 + Math.random() * 0.2,
                        maxLife: 0.55,
                        glow: true
                    });
                }
            } else {
                // Second impact or heavy laser/supernova -> shatter into neon highlighter fragments!
                wb.state = 'obliterated';
                const col = HIGHLIGHTER_COLORS[Math.floor(Math.random() * HIGHLIGHTER_COLORS.length)];
                const count = wb.type === 'bar' ? 14 : 6;
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: wb.x + (Math.random() - 0.5) * wb.w * 0.5,
                        y: wb.y + (Math.random() - 0.5) * wb.h * 0.5,
                        vx: (Math.random() - 0.5) * 420 + impulseX * 0.5,
                        vy: (Math.random() - 0.5) * 420 + impulseY * 0.5,
                        size: 2.5 + Math.random() * 3.5,
                        color: col,
                        life: 0.45 + Math.random() * 0.35,
                        maxLife: 0.8,
                        glow: true
                    });
                }
            }
        }

        function addScreenShake(dirX, dirY, amount) {
            screenShake.vx = Math.clamp(screenShake.vx + dirX * amount * SCREEN_SHAKE_SCALE, -120, 120);
            screenShake.vy = Math.clamp(screenShake.vy + dirY * amount * SCREEN_SHAKE_SCALE, -120, 120);
            screenShake.intensity = Math.min(screenShake.intensity + amount * 0.25, 28);
        }

        function chargedShakeAmount(power, lightAmount, fullAmount) {
            // Reserve the larger impact for the final tenth of the charge / range.
            const boost = Math.clamp((power - .9) / .1, 0, 1);
            return lightAmount + (fullAmount - lightAmount) * boost * boost;
        }

        function updateScreenShake(dt) {
            // Exact critically damped spring: stable at low FPS, without oscillation.
            const damping = 24, decay = Math.exp(-damping * dt);
            for (const [position, velocity] of [['x', 'vx'], ['y', 'vy']]) {
                const coupling = screenShake[velocity] + damping * screenShake[position];
                const next = (screenShake[position] + coupling * dt) * decay;
                screenShake[velocity] = (screenShake[velocity] - damping * coupling * dt) * decay;
                screenShake[position] = Math.clamp(next, -MAX_SCREEN_SHAKE, MAX_SCREEN_SHAKE);
                if (Math.abs(next) > MAX_SCREEN_SHAKE && next * screenShake[velocity] > 0) screenShake[velocity] = 0;
            }
            screenShake.intensity *= Math.pow(0.01, dt);
        }

        function beginAttack() {
            if (rewindMode || customModal.classList.contains('flex')) return;
            sfx.init();
            mouse.down = true;
            if (currentWeapon === 1 || currentWeapon === 3 || currentWeapon === 4) {
                if (stickman.fireCooldown > 0 || stickman.hammerCooldown > 0) return;
                charge.active = true; charge.elapsed = 0; charge.weapon = currentWeapon; charge.pulse = 0;
            } else fireWeapon(.016);
        }
        function releaseAttack() {
            if (charge.active && charge.weapon === currentWeapon && !rewindMode) {
                // A quick click between frames still launches with minimum charge.
                const power = Math.clamp(charge.elapsed / charge.max, 0, 1);
                fireWeapon(.016, currentWeapon === 4 && charge.elapsed < .4 ? 0 : power);
            }
            clearAction();
        }
        function fireWeapon(dt, power = null) {
            if (rewindMode) return;
            if ((currentWeapon === 1 || currentWeapon === 3 || currentWeapon === 4) && power === null) return;
            const { shoulderX, shoulderY, angle, dirX, dirY, muzzleX, muzzleY } = weaponPose();

            if (currentWeapon === 0) {
                // [1] Reviewer #2 Gatling Gun
                if (stickman.fireCooldown > 0) return;
                stickman.fireCooldown = 0.055; // ~18 rounds/sec
                stickman.recoilOffset = 9 * RECOIL_SCALE;

                // Push stickman back slightly from heavy fire
                stickman.vx -= dirX * 48 * RECOIL_SCALE;
                if (!stickman.onGround) stickman.vy -= dirY * 32 * RECOIL_SCALE;

                const spread = (Math.random() - 0.5) * 0.14;
                const bAngle = angle + spread;
                const speed = 1150;
                const label = Math.random() < 0.6 ? GATLING_TEXTS[Math.floor(Math.random() * GATLING_TEXTS.length)] : null;
                weaponHeat = Math.min(1, weaponHeat + .13);

                bullets.push({
                    x: muzzleX,
                    y: muzzleY,
                    vx: Math.cos(bAngle) * speed,
                    vy: Math.sin(bAngle) * speed,
                    angle: bAngle,
                    ascended: flight,
                    label: label,
                    life: 1.2
                });

                // Eject brass shell casing
                shells.push({
                    x: shoulderX + dirX * 18,
                    y: shoulderY + dirY * 18,
                    vx: -dirX * (80 + Math.random() * 80) + (Math.random() - 0.5) * 60,
                    vy: -180 - Math.random() * 90,
                    angle: Math.random() * Math.PI,
                    vAngle: (Math.random() - 0.5) * 25,
                    life: 2.2
                });

                // Muzzle flash particles
                for (let i = 0; i < 4; i++) {
                    particles.push({
                        x: muzzleX,
                        y: muzzleY,
                        vx: Math.cos(bAngle + (Math.random() - 0.5) * 0.5) * (200 + Math.random() * 250),
                        vy: Math.sin(bAngle + (Math.random() - 0.5) * 0.5) * (200 + Math.random() * 250),
                        size: 3 + Math.random() * 3,
                        color: i % 2 === 0 ? '#f43f5e' : '#facc15',
                        life: 0.12,
                        maxLife: 0.12,
                        glow: true
                    });
                }

                addScreenShake(-dirX, -dirY, 2);
                sfx.playGatling();

            } else if (currentWeapon === 1) {
                // [2] Gradient Explosion Black Hole Launcher
                if (stickman.fireCooldown > 0) return;
                stickman.fireCooldown = 0.65;
                stickman.recoilOffset = (10 + power * 15) * RECOIL_SCALE;
                stickman.vx -= dirX * (110 + power * 170) * RECOIL_SCALE;
                stickman.vy -= dirY * (60 + power * 100) * RECOIL_SCALE;
                const range = 110 + power * 620;
                const speed = 600 + power * 900;

                blackHoles.push({
                    x: muzzleX,
                    y: muzzleY,
                    vx: dirX * speed,
                    vy: dirY * speed,
                    remaining: range,
                    power,
                    radius: 8 + power * 8,
                    pullRadius: 128 + power * 205,
                    blastRadius: 160 + power * 250,
                    life: 3.2 + power * .65,
                    maxLife: 3.2 + power * .65,
                    age: 0, collapse: 0, ascended: flight,
                    phase: 0
                });

                addScreenShake(-dirX, -dirY, chargedShakeAmount(power, 2, 6));
                emitSparks(muzzleX, muzzleY, 18, ['#c084fc', '#38bdf8', '#f5d0fe'], 140 + power * 150);

                                y: py,
                                vx: (Math.random() - 0.5) * 260,
                                vy: (Math.random() - 0.5) * 260,

                                life: 0.25 + Math.random() * 0.2,

                                glow: true
                            });

                    }
                }

                // Check line-to-word distance
                for (const wb of wordBodies) {
                    if (wb.state === 'obliterated') continue;

                addScreenShake((Math.random() - 0.5), (Math.random() - 0.5), 1);

            } else if (currentWeapon === 3) {

                stickman.recoilOffset = (8 + power * 7) * RECOIL_SCALE;
                stickman.vx += dirX * (100 + power * 220) * RECOIL_SCALE;
                stickman.vy += (dirY * 100 - 50) * RECOIL_SCALE;
                hammerWaves.push({ x: muzzleX, y: muzzleY, angle, power, traveled: 0,

            } else if (currentWeapon === 4) {

                const x = stickman.x, y = shoulderY;
                swordSlashes.push({ x, y, angle, radius: 64, life: .22, maxLife: .22, ascended: flight });
                scratchSwordArc(x, y, angle, 64);
                const targets = wordBodies.filter(w => w.state !== 'obliterated' && Math.hypot(w.x - x, w.y - y) < 70 && Math.abs(Math.atan2(Math.sin(Math.atan2(w.y - y, w.x - x) - angle), Math.cos(Math.atan2(w.y - y, w.x - x) - angle))) < 1.05)
                    .sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y));
                for (const body of targets.slice(0, 5)) damageWordBody(body, dirX * 180, dirY * 180 - 65);
                if (power > 0) swordWaves.push({ x: muzzleX, y: muzzleY, angle, power, traveled: 0,
                    range: 140 + power * 140, speed: 600, hit: new Set(), ascended: flight });
                emitSparks(muzzleX, muzzleY, 12, flight ? ['#fbbf24', '#ef4444', '#fff7ed'] : ['#67e8f9', '#dffbff'], 100);
                addScreenShake(-dirX, -dirY, 1.8); sfx.playSword(power > 0);

        }

        function scratchSwordArc(x, y, angle, radius) {
            damageIdleTime = 0; damageCtx.save(); damageCtx.translate(x - paperRect.x, y - paperRect.y);
            damageCtx.strokeStyle = '#402c28'; damageCtx.lineWidth = 1.2; damageCtx.beginPath();
            damageCtx.arc(0, 0, radius, angle - .95, angle + .95); damageCtx.stroke();
            damageCtx.strokeStyle = '#a07051'; damageCtx.lineWidth = .5; damageCtx.beginPath();
            damageCtx.arc(0, 0, radius - 3, angle - .85, angle + .85); damageCtx.stroke(); damageCtx.restore();
        }

        function slamHammer(impactX, impactY, power, ascended = flight) {
                const blastRadius = 100 + power * 160;

                // Hit-stop micro freeze for juicy impact feel!
                hitStopTimer = 0.042;
                addScreenShake(0, 1, chargedShakeAmount(power, 3, 32));
                sfx.playHammerSlam();
                scorchPaperAt(impactX, impactY, 30 + power * 55, false);
                // Angular fractures and a second shock front reinforce the existing gold style.
                damageCtx.save(); damageCtx.translate(impactX - paperRect.x, impactY - paperRect.y);
                damageCtx.strokeStyle = '#4c2b1b'; damageCtx.lineWidth = 1.5;
                for (let i = 0; i < 9; i++) {
                    const a = i / 9 * Math.PI * 2, length = (25 + power * 85) * (.7 + Math.random() * .3);
                    damageCtx.beginPath(); damageCtx.moveTo(0, 0);
                    damageCtx.lineTo(Math.cos(a + .15) * length * .5, Math.sin(a + .15) * length * .5);
                    damageCtx.lineTo(Math.cos(a) * length, Math.sin(a) * length); damageCtx.stroke();
                }
                damageCtx.restore();
                emitSparks(impactX, impactY, 30 + Math.round(power * 32), ['#f59e0b', '#fef3c7', '#fb923c'], 220 + power * 340);
                if (ascended) {
                    emitSparks(impactX, impactY, 35, ['#fbbf24', '#ef4444', '#fff7ed'], 420);
                    shockwaves.push({ x: impactX, y: impactY, radius: 10, maxRadius: blastRadius * 1.1, color: '#ef4444', life: .5, maxLife: .5 });
                }
                shockwaves.push({ x: impactX, y: impactY, radius: 8, maxRadius: blastRadius * .7, color: '#fef3c7', life: .23, maxLife: .23 });

                shockwaves.push({
                    x: impactX,
                    y: impactY,
                    radius: 12,
                    maxRadius: blastRadius,
                    color: '#f59e0b',
                    life: 0.35,
                    maxLife: 0.35
                });

    
                for (const wb of wordBodies) {
                    if (wb.state === 'obliterated') continue;
                    const dx = wb.x - impactX;
                    const dy = wb.y - impactY;
                    const dist = Math.hypot(dx, dy);
                    if (dist < blastRadius) {
                        const force = (1 - dist / blastRadius) * (420 + power * 900);
                        const nx = dx / (dist || 1);
                        const ny = dy / (dist || 1);
                        damageWordBody(wb, nx * force, ny * force - 240, dist < 22 + power * 110);
                    }
                }
        }

        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;
            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;
            if (lenSq !== 0) param = dot / lenSq;
            let xx, yy;
            if (param < 0) { xx = x1; yy = y1; }
            else if (param > 1) { xx = x2; yy = y2; }
            else { xx = x1 + param * C; yy = y1 + param * D; }
            return Math.hypot(px - xx, py - yy);
        }

        function segmentHitsBox(x1, y1, x2, y2, body, padding = 0) {
            const bounds = [body.x - body.w / 2 - padding, body.x + body.w / 2 + padding,
                body.y - body.h / 2 - padding, body.y + body.h / 2 + padding];
            let near = 0, far = 1;
            for (const [start, delta, min, max] of [[x1, x2 - x1, bounds[0], bounds[1]], [y1, y2 - y1, bounds[2], bounds[3]]]) {
                if (Math.abs(delta) < .00001) { if (start < min || start > max) return false; }
                else {
                    const a = (min - start) / delta, b = (max - start) / delta;
                    near = Math.max(near, Math.min(a, b)); far = Math.min(far, Math.max(a, b));
                    if (near > far) return false;
                }
            }
            return true;
        }

        function updateSimulation(dt) {
            fadeDamageMarks(dt);
            // 1. Update the frame-rate independent camera response.
            updateScreenShake(dt);
            if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - dt * 2.8);

            // 2. Rewind / Re-typeset interpolation
            if (rewindMode) {
                rewindTimer += dt;
                // Gradually clear scorch marks on paper
                damageCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                damageCtx.globalCompositeOperation = 'destination-out';
                damageCtx.fillRect(0, 0, paperRect.w, paperRect.h);
                damageCtx.globalCompositeOperation = 'source-over';
                residueCtx.save(); residueCtx.globalCompositeOperation = 'destination-out'; residueCtx.fillStyle = '#ffffff22';
                residueCtx.fillRect(0, 0, residueCanvas.width, residueCanvas.height); residueCtx.restore();
                for (const p of particles) { p.x -= p.vx * dt * .5; p.y -= p.vy * dt * .5; }

                let allRestored = true;
                for (const wb of wordBodies) {
                    if (wb.state !== 'formatted') {
                        wb.state = 'detached';
                        wb.x += (wb.origX - wb.x) * 0.18;
                        wb.y += (wb.origY - wb.y) * 0.18;
                        wb.angle += (0 - wb.angle) * 0.2;
                        wb.vx = 0;
                        wb.vy = 0;
                        if (Math.hypot(wb.origX - wb.x, wb.origY - wb.y) < 1.5 && Math.abs(wb.angle) < 0.05) {
                            wb.x = wb.origX;
                            wb.y = wb.origY;
                            wb.angle = 0;
                            wb.state = 'formatted';
                        } else {
                            allRestored = false;
                        }
                    }
                }
                if ((allRestored && rewindTimer >= 1.1) || rewindTimer > 1.5) {
                    rewindMode = false;
                    damageCtx.clearRect(0, 0, paperRect.w, paperRect.h);
                    residueCtx.clearRect(0, 0, residueCanvas.width, residueCanvas.height);
                    wordBodies.forEach(wb => {
                        wb.x = wb.origX;
                        wb.y = wb.origY;
                        wb.angle = 0;
                        wb.state = 'formatted';
                    });
                }
                
                return;
            }

            // 3. Stickman & Continuous Firing
            stickman.update(dt);
            weaponHeat = Math.max(0, weaponHeat - dt * .45);
            if (charge.active) {
                charge.elapsed = Math.min(charge.max, charge.elapsed + dt);
                charge.pulse += dt;
                if (charge.pulse >= .04) {
                    charge.pulse = 0;
                    const a = Math.random() * Math.PI * 2, r = 22 + charge.elapsed * 17;
                    const { muzzleX: mx, muzzleY: my } = weaponPose();
                    emitSparks(mx + Math.cos(a) * r, my + Math.sin(a) * r, 1,
                        flight ? ['#fbbf24', '#ef4444'] : charge.weapon === 1 ? ['#c084fc', '#38bdf8'] : charge.weapon === 4 ? ['#67e8f9', '#dffbff'] : ['#fbbf24', '#fb923c'], 12, -Math.cos(a) * 100, -Math.sin(a) * 100);
                }
            }
            if (mouse.down && !charge.active) {
                fireWeapon(dt);
            }

            for (let i = hammerWaves.length - 1; i >= 0; i--) {
                const hammer = hammerWaves[i];
                const step = Math.min(hammer.range - hammer.traveled, hammer.speed * dt);
                hammer.x += Math.cos(hammer.angle) * step; hammer.y += Math.sin(hammer.angle) * step;
                hammer.traveled += step;
                emitSparks(hammer.x, hammer.y, 2, ['#f59e0b', '#fef3c7'], 70, -Math.cos(hammer.angle) * 100, -Math.sin(hammer.angle) * 100);
                if (hammer.traveled >= hammer.range) {
                    slamHammer(hammer.x, hammer.y, hammer.power, hammer.ascended); hammerWaves.splice(i, 1);
                }
            }
            for (let i = swordSlashes.length - 1; i >= 0; i--) {
                swordSlashes[i].life -= dt; if (swordSlashes[i].life <= 0) swordSlashes.splice(i, 1);
            }
            for (let i = swordWaves.length - 1; i >= 0; i--) {
                const wave = swordWaves[i], oldX = wave.x, oldY = wave.y;
                const step = Math.min(wave.range - wave.traveled, wave.speed * dt);
                wave.x += Math.cos(wave.angle) * step; wave.y += Math.sin(wave.angle) * step; wave.traveled += step;
                for (const body of wordBodies) {
                    if (wave.hit.size >= 8 || wave.hit.has(body) || body.state === 'obliterated') continue;
                    if (segmentHitsBox(oldX, oldY, wave.x, wave.y, body, 12)) {
                        wave.hit.add(body); damageWordBody(body, Math.cos(wave.angle) * 190, Math.sin(wave.angle) * 190 - 70);
                        scorchLaserLine(oldX, oldY, wave.x, wave.y);
                    }
                }
                if (wave.traveled >= wave.range) { scratchSwordArc(wave.x, wave.y, wave.angle, 18); swordWaves.splice(i, 1); }
            }

            // 4. Gatling Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                const oldX = b.x, oldY = b.y;
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;

                let hit = false;
                for (const wb of wordBodies) {
                    if (wb.state === 'obliterated') continue;
                    if (segmentHitsBox(oldX, oldY, b.x, b.y, wb, 3)) {
                        damageWordBody(wb, b.vx * 0.32, b.vy * 0.32 - 80);
                        scorchPaperAt(b.x, b.y, 12 + Math.random() * 8);
                        emitSparks(b.x, b.y, 5, ['#f43f5e', '#facc15', '#fda4af'], 190);
                        hit = true;
                        break;
                    }
                }

                if (hit || b.life <= 0 || b.x < -100 || b.x > W + 100 || b.y < -100 || b.y > H + 100) {
                    bullets.splice(i, 1);
                }
            }

            // 5. Ejected Brass Shells
            const floorY = H - 16;
            for (let i = shells.length - 1; i >= 0; i--) {
                const s = shells[i];
                s.vy += 1200 * dt;
                s.x += s.vx * dt;
                s.y += s.vy * dt;
                s.angle += s.vAngle * dt;
                s.life -= dt;
                if (s.y > floorY) {
                    s.y = floorY;
                    s.vy *= -0.45;
                    s.vx *= 0.7;
                    s.vAngle *= 0.6;
                }
                if (s.life <= 0) shells.splice(i, 1);
            }

            // 6. Gradient Explosion Black Holes (Gravitational Vortex + Supernova)
            for (let i = blackHoles.length - 1; i >= 0; i--) {
                const bh = blackHoles[i];
                const speed = Math.hypot(bh.vx, bh.vy);
                const step = Math.min(bh.remaining, speed * dt);
                if (speed > 0) { bh.x += bh.vx / speed * step; bh.y += bh.vy / speed * step; }
                bh.remaining -= step;
                bh.life -= dt;
                bh.age += dt;
                bh.collapse = Math.clamp(bh.age / bh.maxLife, 0, 1);
                bh.phase += dt * 12;
                const fieldRadius = bh.pullRadius * (.25 + .75 * Math.pow(bh.collapse, .65));

                scorchPaperAt(bh.x, bh.y, Math.max(4, bh.radius * (bh.remaining > 0 ? .32 : .5)), false);

                // Pull nearby words into swirling vortex
                for (const wb of wordBodies) {
                    if (wb.state === 'obliterated') continue;
                    const dx = bh.x - wb.x;
                    const dy = bh.y - wb.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < fieldRadius) {
                        if (wb.state === 'formatted') {
                            wb.state = 'detached';
                            sfx.playWordDetach();
                        }
                        const pull = (1 - dist / fieldRadius) * (1400 + bh.power * 2400) * (.4 + bh.collapse * .7) * dt;
                        const nx = dx / (dist || 1);
                        const ny = dy / (dist || 1);
                        // Swirl tangent + inward pull
                        wb.vx += (nx * pull - ny * pull * 0.65);
                        wb.vy += (ny * pull + nx * pull * 0.5) - 980 * dt * .85;
                        wb.vAngle += 18 * dt;
                        if (dist < bh.radius * .8) damageWordBody(wb, 0, 0, true);
                    }
                }

                // Emit inward accretion particles
                if (Math.random() < 0.7) {
                    const ang = Math.random() * Math.PI * 2;
                    const dist = 30 + Math.random() * fieldRadius * .65;
                    particles.push({
                        x: bh.x + Math.cos(ang) * dist,
                        y: bh.y + Math.sin(ang) * dist,
                        vx: -Math.cos(ang) * 220,
                        vy: -Math.sin(ang) * 220,
                        size: 2.5 + Math.random() * 2.5,
                        color: bh.ascended ? (Math.random() < .5 ? '#fbbf24' : '#ef4444') : (Math.random() < 0.5 ? '#c084fc' : '#38bdf8'),
                        life: 0.28,
                        maxLife: 0.28,
                        glow: true
                    });
                }

                // Detonate Supernova when timer expires!
                if (bh.life <= 0) {
                    hitStopTimer = 0.048; // 48ms Hit-stop freeze!
                    screenFlash = 0.08;
                    addScreenShake((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, chargedShakeAmount(bh.power, 3, 34));
                    sfx.playSupernova();
                    scorchPaperAt(bh.x, bh.y, 55 + bh.power * 95, true);

                    shockwaves.push({
                        x: bh.x,
                        y: bh.y,
                        radius: 15,
                        maxRadius: bh.blastRadius,
                        inward: true,
                        color: '#a855f7',
                        life: 0.45,
                        maxLife: 0.45
                    });

        
                    for (const wb of wordBodies) {
                        if (wb.state === 'obliterated') continue;
                        const dx = wb.x - bh.x;
                        const dy = wb.y - bh.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < bh.blastRadius) {
                            const blast = (1 - dist / bh.blastRadius) * (650 + bh.power * 1300);
                            const nx = dx / (dist || 1);
                            const ny = dy / (dist || 1);
                            damageWordBody(wb, nx * blast, ny * blast - 250, dist < 35 + bh.power * 145);
                        }
                    }

                    for (let p = 0; p < 55; p++) {
                        const a = Math.random() * Math.PI * 2;
                        const sp = 140 + Math.random() * 680;
                        particles.push({
                            x: bh.x + Math.cos(a) * 120,
                            y: bh.y + Math.sin(a) * 120,
                            vx: -Math.cos(a) * sp * .45,
                            vy: -Math.sin(a) * sp * .45,
                            size: 3 + Math.random() * 4.5,
                            color: p % 3 === 0 ? '#38bdf8' : (p % 2 === 0 ? '#c084fc' : '#f43f5e'),
                            life: 0.5 + Math.random() * 0.4,
                            maxLife: 0.9,
                            glow: true
                        });
                    }

                    blackHoles.splice(i, 1);
                }
            }

            // 7. Update Detached Word Rigid Bodies (Gravity, Spin & Pile-up at Bottom)
            const pileFloorY = H - 22;
            for (const wb of wordBodies) {
                if (wb.state !== 'detached') continue;
                wb.vy += 980 * dt; // Gravity
                wb.vx *= Math.pow(0.45, dt); // Air drag
                wb.x += wb.vx * dt;
                wb.y += wb.vy * dt;
                wb.angle += wb.vAngle * dt;

                // Bounce off bottom screen pile
                if (wb.y > pileFloorY) {
                    wb.y = pileFloorY;
                    wb.vy *= -0.38;
                    wb.vx *= 0.72;
                    wb.vAngle *= 0.65;
                }
                // Bounce off side walls
                if (wb.x < 30 || wb.x > W - 30) {
                    wb.vx *= -0.6;
                    wb.x = Math.clamp(wb.x, 30, W - 30);
                }
            }

            // 8. Update Particles, Shockwaves & Floating Labels
            if (particles.length > 1800) particles.splice(0, particles.length - 1800);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 360 * dt;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.life -= dt;
                const progress = 1 - sw.life / sw.maxLife;
                sw.radius = sw.inward ? sw.maxRadius * Math.pow(1 - progress, 2) : sw.maxRadius * (1 - Math.pow(1 - progress, 3));
                if (sw.life <= 0) shockwaves.splice(i, 1);
            }


            if (forceAccepted && acceptStampScale < 1) {
                acceptStampScale = Math.min(1, acceptStampScale + dt * 6.5);
            }

            
        }

        function renderScene() {
            const audioActive = audioFocused && !document.hidden;
            sfx.sync(audioActive && mouse.down && currentWeapon === 2 && !rewindMode, audioActive ? blackHoles.length : 0,
                audioActive && charge.active && charge.weapon === 1 ? Math.max(.01, charge.elapsed / charge.max) : 0);
            ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
            ctx.save();
            ctx.fillStyle = '#0b0d12';
            ctx.fillRect(0, 0, W, H);

            // Apply Directional Screen Shake
            ctx.translate(screenShake.x, screenShake.y);

            // 1. Subtle Dark Editorial Grid Background
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.028)';
            ctx.lineWidth = 1;
            const gridSize = 42;
            ctx.beginPath();
            for (let x = 0; x < W; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
            }
            for (let y = 0; y < H; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
            }
            ctx.stroke();

            // 2. Academic Paper Sheet with Deep Shadow
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.78)';
            ctx.shadowBlur = 45;
            ctx.shadowOffsetY = 18;
            ctx.fillStyle = '#fcfaf5'; // Warm LaTeX Ivory Paper
            const sheets = currentTemplateKey === 'pdf' && currentPdfPageData ? currentPdfPageData.pages.map(p => p.rect) : [paperRect];
            for (const sheet of sheets) {
                ctx.beginPath(); ctx.roundRect(sheet.x, sheet.y, sheet.w, sheet.h, 3); ctx.fill();
            }
            ctx.restore();
            if (currentTemplateKey === 'pdf') {
                if (currentPdfPageData) {
                    for (const page of currentPdfPageData.pages) ctx.drawImage(page.data.source, page.rect.x, page.rect.y, page.rect.w, page.rect.h);
                    // Remove hit text from the original page; draw detached crops as paper shreds below.
                    for (const body of wordBodies) {
                        if (body.state === 'formatted') continue;
                        ctx.fillStyle = body.background;
                        ctx.fillRect(body.origX - body.w / 2, body.origY - body.h / 2, body.w, body.h);
                    }
                } else {
                    ctx.save(); ctx.font = '14px sans-serif'; ctx.fillStyle = '#475569'; ctx.textAlign = 'center';
                    ctx.fillText(pdfPageError || '正在加载 PDF 页面…', paperRect.x + paperRect.w / 2, paperRect.y + paperRect.h / 2); ctx.restore();
                }
            }

            // 3. Draw Decorative LaTeX Lines, Figure 1 Axes & Platform Ledges on Paper

            ctx.drawImage(damageCanvas, paperRect.x, paperRect.y);

            // 5. Render All Word & Chart Bar Rigid Bodies
            const damagedGraphics = currentTemplateKey === 'pdf' && wordBodies.some(w => w.type === 'pdfGraphic' && w.state !== 'formatted');
            for (const wb of wordBodies) {
                if (wb.state === 'obliterated') continue;
                ctx.save();
                ctx.translate(wb.x, wb.y);
                if (wb.angle !== 0) ctx.rotate(wb.angle);
                for (const well of blackHoles) {

                        const page = currentPdfPageData.pages.find(p => p.index === wb.pageIndex);

            for (const well of blackHoles) drawSpaceCollapse(well);

            // 6. Render Active DDL Continuous Laser Beam (if holding mouse with Weapon 2)
            if (mouse.down && currentWeapon === 2 && !rewindMode) {

                ctx.lineWidth = 6;
                ctx.beginPath();

                ctx.lineTo(endX, endY);

            // 8. Render Gatling Bullets & Flying "REJECT" Text Projectiles
            for (const b of bullets) {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.angle);
                if (b.ascended) {
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 7; ctx.globalAlpha = .65;
                    ctx.beginPath(); ctx.moveTo(-85, 0); ctx.lineTo(10, 0); ctx.stroke(); ctx.globalAlpha = 1;
                    ctx.fillStyle = '#fde68a'; ctx.fillRect(-30, -3.5, 40, 7);
                }

                const trail = ctx.createLinearGradient(-65, 0, 12, 0);
                trail.addColorStop(0, '#f43f5e00'); trail.addColorStop(.8, '#f43f5e88'); trail.addColorStop(1, '#fef3c7');
                ctx.fillStyle = trail; ctx.fillRect(-65, -1.3, 77, 2.6);

                    ctx.fillStyle = '#f43f5e';
                    ctx.shadowColor = '#f43f5e';
                    ctx.shadowBlur = 10;

                ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 22;

                ctx.fillStyle = '#1e293b'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(6, -18, 18, 36, 3); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#fef3c7'; ctx.fillRect(9, -12, 12, 3); ctx.fillRect(9, 9, 12, 3); ctx.restore();

            }

                ctx.strokeStyle = sw.color;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = 6 * alpha;
                ctx.beginPath();
                ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.restore();

            if (forceAccepted) {
                ctx.save(); ctx.translate(paperRect.x + paperRect.w / 2, paperRect.y + paperRect.h * .45); ctx.rotate(-.13);
                const stampScale = 1 + (1 - acceptStampScale) * .35;
                ctx.scale(stampScale, stampScale); const fontSize = Math.min(86, paperRect.w * .14); ctx.font = `900 ${fontSize}px Georgia,serif`;
                ctx.fillStyle = '#10b981'; ctx.globalAlpha = .9; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const stampWidth = ctx.measureText('Accept').width + fontSize * .65;
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3.5; ctx.strokeRect(-stampWidth / 2, -fontSize * .65, stampWidth, fontSize * 1.3);
                ctx.fillText('Accept', 0, 0); ctx.restore();
            }
            if (rewindMode) drawTimeRewind();

            // Screen Flash Overlay on Supernova / Accept Stamp
            if (screenFlash > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash})`;
                ctx.fillRect(-50, -50, W + 100, H + 100);
            }

            ctx.restore();
        }

        function drawWeaponEnergy() {
            const { angle: a, dirX: dx, dirY: dy, muzzleX: x, muzzleY: y } = weaponPose();
            if (currentWeapon === 0 && weaponHeat > .08) {
                ctx.save(); ctx.translate(x, y); ctx.rotate(a);
                ctx.fillStyle = `rgba(255,160,50,${weaponHeat * .65})`; ctx.shadowColor = '#f43f5e'; ctx.shadowBlur = 14;
                ctx.fillRect(-20, -5, 18, 10); ctx.restore();
            }
            if (!charge.active) return;
            const power = Math.clamp(charge.elapsed / charge.max, 0, 1), color = flight ? '#fbbf24' : charge.weapon === 1 ? '#c084fc' : charge.weapon === 4 ? '#67e8f9' : '#fbbf24';
            const range = charge.weapon === 1 ? 110 + power * 620 : charge.weapon === 4 ? 140 + power * 140 : 70 + power * 620;
            ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.globalAlpha = .35;
            ctx.setLineDash([4, 7]); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx * range, y + dy * range); ctx.stroke(); ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(x + dx * range, y + dy * range, 9 + power * 9, 0, Math.PI * 2); ctx.stroke();
            ctx.globalAlpha = 1; ctx.translate(x, y); ctx.shadowColor = color; ctx.shadowBlur = 15 + power * 15;
            const radius = 12 + power * 17;
            for (let i = 0; i < 3; i++) {

                ctx.lineWidth = 1 + power * 1.5; ctx.globalAlpha = .4 + i * .2;
                ctx.beginPath(); ctx.arc(0, 0, radius + i * 5, phase, phase + 1.8 + power * 2); ctx.stroke();
            }
            ctx.globalAlpha = 1; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, 3 + power * 7, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            const hx = Math.clamp(stickman.x - 36, paperRect.x, paperRect.x + paperRect.w - 72), hy = Math.max(paperRect.y + 4, stickman.y - 70);
            ctx.save(); ctx.fillStyle = '#0b0d12ee'; ctx.beginPath(); ctx.roundRect(hx, hy, 72, 25, 5); ctx.fill();
            ctx.font = '600 10px "JetBrains Mono",monospace'; ctx.textAlign = 'center'; ctx.fillStyle = color;

            ctx.fillStyle = '#334155'; ctx.fillRect(hx + 7, hy + 18, 58, 3); ctx.fillStyle = color; ctx.fillRect(hx + 7, hy + 18, 58 * power, 3); ctx.restore();
        }

            if (event.key === 'Enter') { event.preventDefault(); submitPdfPassword(); }
        });

        document.getElementById('applyCustomBtn').addEventListener('click', () => {
            const customTitle = document.getElementById('customTitleInput').value.trim();
            const customBody = document.getElementById('customBodyInput').value.trim();
            if (customTitle || customBody) {
                savePageState(); clearTransientEffects(); currentPage = 0; customPages = [];
                for (const key of pageStates.keys()) { if (key.startsWith('custom:')) pageStates.delete(key); }
                PAPER_TEMPLATES.custom = {
                    ...PAPER_TEMPLATES.neurips,
                    venue: "Custom Target Manuscript · Ready For Immediate Destruction",
                    title: customTitle || "Untitled Source of Graduate Student Suffering and Sleepless Nights",
                    abstract: customBody || PAPER_TEMPLATES.neurips.abstract,
                    sec1Body: customBody || PAPER_TEMPLATES.neurips.sec1Body
                };
                currentTemplateKey = 'custom';
                let customOption = document.querySelector('#paperSelect option[value="custom"]');
                if (!customOption) {
                    customOption = document.createElement('option'); customOption.value = 'custom';
                    customOption.textContent = '文本'; document.getElementById('paperSelect').appendChild(customOption);
                }
                document.getElementById('paperSelect').value = 'custom';
                layoutAcademicPaper();
                stickman.resetPosition();
            }
            closeCustomModal();
        });

        let lastTime = performance.now();

        function gameLoop(now) {
            const rawDt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (hitStopTimer > 0) {
                hitStopTimer -= rawDt;
            } else {
                updateSimulation(rawDt);
            }

            renderScene();
            requestAnimationFrame(gameLoop);
        }

        window.onload = function () {
            configureCanvas();
            layoutAcademicPaper();
            stickman.resetPosition();
            // Font metrics affect both wrapping and physics; reflow once web fonts settle.
            document.fonts.ready.then(() => {
                if (!wordBodies.some(w => w.state !== 'formatted') && !mouse.down && currentTemplateKey !== 'custom') {
                    layoutAcademicPaper(); stickman.resetPosition();
                }
            });
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
